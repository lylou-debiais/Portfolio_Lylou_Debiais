<!DOCTYPE html>
<html lang="fr">
<head>
      <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lylou Debiais — Créatrice Numérique & UI/UX Designer</title>
  <meta name="description" content="Portfolio de Lylou Debiais, créatrice numérique et UI/UX designer. BUT MMI, Limoges.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="site-loader" id="site-loader" aria-live="polite">
    <div class="loader-orbit loader-orbit-one"></div>
    <div class="loader-orbit loader-orbit-two"></div>
    <div class="loader-shell">
      <span class="loader-kicker">Portfolio · Création numérique</span>
      <img src="assets/logo.png" alt="Lylou Debiais">
      <span class="loader-caption">Lylou Debiais</span>
      <div class="loader-progress">
        <div class="loader-bar" id="loader-bar"></div>
      </div>
      <div class="loader-meta">
        <span>Chargement de l'expérience</span>
        <span id="loader-percent">0%</span>
      </div>
    </div>
  </div>
      <nav>
    <div class="w">
      <a href="#/" class="logo">ld<i>.</i></a>
      <div class="links" id="nav-links">
        <a href="#/" data-r="home">À propos</a>
        <a href="#/realisations" data-r="realisations">Mes réalisations</a>
        <a href="#/cv" data-r="cv">CV &amp; Compétences</a>
        <a class="btn" href="#/contact">Me contacter</a>
      </div>
      <div class="nav-tools">
        <button class="lang-btn on" type="button" onclick="switchLanguage('fr')">FR</button>
        <button class="lang-btn" type="button" onclick="switchLanguage('en')">EN</button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Changer le thème" onclick="toggleTheme()">☾</button>
        <button class="icon-btn menu-btn" type="button" aria-label="Menu" onclick="toggleMenu()">☰</button>
      </div>
    </div>
      </nav>
        <div class="page-cover" id="page-cover" aria-hidden="true">
          <img src="assets/logo.png" alt="">
        </div>
        <main id="app"></main>
  <footer>
    <div class="w">
      <span id="copy-year">© 2026 Portfolio MMI — Lylou Debiais</span>
      <span id="copy-passion">Créé avec passion</span>
    </div>
     </footer>
  <script src="script.js"></script>
</body>
</html>
